name: NPB順位データ自動更新

on:
  schedule:
    - cron: '0 0 * * *'    # JST 09:00（朝の確認）
    - cron: '0 6 * * *'    # JST 15:00（昼の確認）
    - cron: '30 13 * * *'  # JST 22:30（試合終了後）
  workflow_dispatch:        # 手動実行も可能

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: NPB順位・試合データ取得
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_standings.py

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/standings.json
          if git diff --cached --quiet; then
            echo "変更なし。スキップします。"
          else
            git commit -m "chore: NPBデータ更新 $(TZ='Asia/Tokyo' date +'%Y/%m/%d %H:%M') JST"
            git push
          fi
